<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <!-- Deep Blue Radial Glow -->
    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- 3D Prism Shading Gradients for Hexagon -->
    <linearGradient id="prismTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="prismLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="prismRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <!-- 3D 'M' Gradient -->
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>

    <filter id="mDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#38bdf8" flood-opacity="0.45"/>
    </filter>
  </defs>

  <style>
    .float { animation: floating 5s ease-in-out infinite; }
    .spin { animation: spinCW 22s linear infinite; transform-origin: 400px 410px; }
    .revSpin { animation: spinCCW 15s linear infinite; transform-origin: 400px 410px; }
    .pulse { animation: pulsing 3s ease-in-out infinite; transform-origin: 400px 410px; }
    .badgeFloat { animation: bFloat 4.5s ease-in-out infinite; }

    @keyframes floating {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(1deg); }
    }
    @keyframes spinCW {
      to { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      to { transform: rotate(-360deg); }
    }
    @keyframes pulsing {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes bFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="900" fill="url(#bgGrad)"/>
  <rect width="800" height="900" fill="url(#grid)"/>

  <!-- Radial Trust Core Glow -->
  <circle class="pulse" cx="400" cy="410" r="340" fill="url(#radialGlow)"/>

  <!-- Orbital Rings & Satellite Nodes -->
  <circle class="spin" cx="400" cy="410" r="270" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 16" stroke-linecap="round"/>
  <circle class="revSpin" cx="400" cy="410" r="210" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="5 12" stroke-opacity="0.7"/>

  <!-- Orbiting Satellite Spheres -->
  <g class="spin">
    <circle cx="400" cy="140" r="13" fill="#38bdf8" filter="url(#mDropShadow)"/>
    <circle cx="670" cy="410" r="10" fill="#2563eb"/>
    <circle cx="130" cy="410" r="8" fill="#60a5fa"/>
  </g>
  <g class="revSpin">
    <circle cx="400" cy="620" r="11" fill="#ffffff"/>
    <circle cx="550" cy="260" r="7" fill="#38bdf8"/>
    <circle cx="250" cy="560" r="9" fill="#1d4ed8"/>
  </g>

  <!-- Central 3D Floating Isometric Hexagon Badge -->
  <g class="float" style="transform-origin: 400px 410px;">
    <!-- Ambient 3D Shadow -->
    <ellipse cx="400" cy="590" rx="160" ry="32" fill="#000000" opacity="0.45" filter="url(#mDropShadow)"/>

    <!-- 3D Facets of the Hexagonal Platform -->
    <g class="pulse">
      <!-- Base Outer Hexagon Outline -->
      <polygon points="400,240 540,320 540,480 400,560 260,480 260,320" fill="#0f172a" stroke="#2563eb" stroke-width="4" filter="url(#mDropShadow)"/>

      <!-- Isometric Facets for Depth -->
      <polygon points="400,244 536,322 400,400 264,322" fill="url(#prismTop)" opacity="0.9"/>
      <polygon points="264,322 400,400 400,556 264,478" fill="url(#prismLeft)" opacity="0.95"/>
      <polygon points="400,400 536,322 536,478 400,556" fill="url(#prismRight)" opacity="0.95"/>

      <!-- Inner Glow Ring -->
      <polygon points="400,270 510,335 510,465 400,530 290,465 290,335" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 8" opacity="0.8"/>
    </g>

    <!-- 3D Monogram 'M' -->
    <g filter="url(#mDropShadow)">
      <path d="M 330 475 L 330 345 L 400 422 L 470 345 L 470 475" fill="none" stroke="#0b1736" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 330 472 L 330 342 L 400 419 L 470 342 L 470 472" fill="none" stroke="#1d4ed8" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 330 465 L 330 335 L 400 412 L 470 335 L 470 465" fill="none" stroke="url(#mGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 370 448 L 430 448" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Floating Service Pills Around Central Model -->
  <!-- Websites -->
  <g class="badgeFloat" style="animation-delay: 0s;">
    <rect x="50" y="160" width="180" height="52" rx="26" fill="#0f172a" stroke="#2563eb" stroke-width="2" filter="url(#mDropShadow)"/>
    <circle cx="78" cy="186" r="10" fill="#2563eb"/>
    <text x="145" y="194" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Websites</text>
  </g>

  <!-- Apps -->
  <g class="badgeFloat" style="animation-delay: 0.8s;">
    <rect x="570" y="220" width="170" height="52" rx="26" fill="#2563eb" stroke="#60a5fa" stroke-width="1.5" filter="url(#mDropShadow)"/>
    <text x="655" y="254" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Apps</text>
  </g>

  <!-- Software -->
  <g class="badgeFloat" style="animation-delay: 1.6s;">
    <rect x="50" y="660" width="185" height="52" rx="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#mDropShadow)"/>
    <circle cx="78" cy="686" r="10" fill="#38bdf8"/>
    <text x="148" y="694" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Software</text>
  </g>

  <!-- Marketing -->
  <g class="badgeFloat" style="animation-delay: 2.4s;">
    <rect x="560" y="700" width="185" height="52" rx="26" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" filter="url(#mDropShadow)"/>
    <text x="652" y="734" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Marketing</text>
  </g>

  <!-- Advertising -->
  <g class="badgeFloat" style="animation-delay: 3.2s;">
    <rect x="295" y="815" width="210" height="52" rx="26" fill="#0f172a" stroke="#4f46e5" stroke-width="2" filter="url(#mDropShadow)"/>
    <circle cx="325" cy="841" r="10" fill="#4f46e5"/>
    <text x="410" y="849" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="20" fill="#ffffff">Advertising</text>
  </g>
</svg>