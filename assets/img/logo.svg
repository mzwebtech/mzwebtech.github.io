<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.35"/>
    </filter>
  </defs>
  <style>
    .orbit { animation: orbitSpin 7s linear infinite; transform-origin: 100px 100px; }
    @keyframes orbitSpin { to { transform: rotate(360deg); } }
  </style>

  <!-- Hexagonal Tech Badge -->
  <polygon points="100,18 172,59 172,141 100,182 28,141 28,59" fill="#0f172a" filter="url(#glow)"/>
  <polygon points="100,24 167,62 167,138 100,176 33,138 33,62" fill="none" stroke="url(#mzGrad)" stroke-width="3" stroke-opacity="0.7"/>

  <!-- Bold Modern 'M' / 'MZ' geometry -->
  <path d="M62 136 L62 66 L100 108 L138 66 L138 136" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Modern accent bar -->
  <path d="M82 122 L118 122" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Orbiting pulse indicator -->
  <g class="orbit">
    <circle cx="100" cy="8" r="9" fill="#38bdf8"/>
    <circle cx="100" cy="8" r="4" fill="#ffffff"/>
  </g>
</svg>